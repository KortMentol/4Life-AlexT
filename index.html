<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>4Life: Здоровье, Энергия, Возможности | Официальный Представитель</title>
    <meta
      name="description"
      content="Инвестируйте в свое здоровье и будущее с 4Life. Узнайте о продуктах для иммунной системы, энергии и возможностях партнерства. Ваш наставник в мире 4Life."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Early sentinel: ensures first Back stays within this page so we can close the menu instead of leaving the site -->
    <script>
      (function () {
        try {
          var st = window.history.state || {};
          if (!st || !st.__sentinel) {
            // mark current entry and create a duplicate on top
            window.history.replaceState(Object.assign({}, st, { __sentinel: true }), document.title);
            window.history.pushState(Object.assign({}, st, { __sentinel: true }), document.title);
          }
        } catch (e) {
          /* noop */
        }
      })();
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
      :root {
        --preloader-bg-light: #f1f5f9;
        --preloader-bg-dark: #0f172a;
        --preloader-text-light: #475569;
        --preloader-text-dark: #94a3b8;
        --preloader-percent-light: #1e293b;
        --preloader-percent-dark: #e2e8f0;
        --preloader-neon-color: #00aaff;
        --preloader-track-color-light: rgba(100, 116, 139, 0.15);
        --preloader-track-color-dark: rgba(203, 213, 225, 0.1);
      }
      html {
        scrollbar-gutter: stable;
      }
      #preloader {
        position: fixed;
        inset: 0;
        /* Поднимаем прелоадер выше любых оверлеев приложения */
        z-index: 2147483647; /* max safe z-index */
        display: grid;
        place-items: center;
        background: var(--preloader-bg-light);
        opacity: 1;
        will-change: opacity;
      }
      @media (prefers-color-scheme: dark) {
        #preloader {
          background: var(--preloader-bg-dark);
        }
      }

      .preloader-content {
        position: relative;
        width: 140px;
        height: 220px;
      }

      .progress-ring-container,
      .preloader-text-group {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        will-change: transform, opacity;
      }

      .progress-ring-container {
        top: 0;
        width: 140px;
        height: 140px;
      }
      .preloader-text-group {
        top: 160px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        width: 250px;
      }

      .preloader-anim-item {
        opacity: 0;
        transform: translateY(30px) translateX(-50%);
      }

      .progress-ring-haze {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, var(--preloader-neon-color) 0%, transparent 65%);
        opacity: 0.15;
        filter: blur(30px);
        animation: preloader-haze-pulse 4s ease-in-out infinite;
      }
      @keyframes preloader-haze-pulse {
        0%,
        100% {
          transform: scale(0.95);
          opacity: 0.1;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.2;
        }
      }

      .progress-ring__svg {
        overflow: visible;
      }
      .progress-ring__track,
      .progress-ring__progress {
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
      }
      .progress-ring__track {
        stroke: var(--preloader-track-color-light);
      }
      @media (prefers-color-scheme: dark) {
        .progress-ring__track {
          stroke: var(--preloader-track-color-dark);
        }
      }
      .progress-ring__progress {
        stroke: var(--preloader-neon-color);
        filter: drop-shadow(0 0 5px var(--preloader-neon-color)) drop-shadow(0 0 15px var(--preloader-neon-color));
        stroke-linecap: round;
      }

      .preloader-logo-wrapper {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        animation: preloader-logo-pulse 4s ease-in-out infinite;
      }
      @keyframes preloader-logo-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
      }
      .preloader-logo {
        width: 64px;
        height: 64px;
      }

      .preloader-text,
      .preloader-percentage {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji",
          "Segoe UI Emoji", "Segoe UI Symbol";
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        white-space: nowrap;
      }

      .preloader-text {
        font-size: 1rem;
        font-weight: 500;
        color: var(--preloader-text-light);
      }
      @media (prefers-color-scheme: dark) {
        .preloader-text {
          color: var(--preloader-text-dark);
        }
      }

      .preloader-percentage {
        font-size: 1.5rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--preloader-percent-light);
      }
      @media (prefers-color-scheme: dark) {
        .preloader-percentage {
          color: var(--preloader-percent-dark);
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <div class="preloader-content">
        <div class="progress-ring-container preloader-anim-item">
          <div class="progress-ring-haze"></div>
          <svg class="progress-ring__svg" width="140" height="140">
            <circle class="progress-ring__track" stroke-width="3" fill="transparent" r="68" cx="70" cy="70" />
            <circle
              id="progress-ring-circle"
              class="progress-ring__progress"
              stroke-width="3"
              fill="transparent"
              r="68"
              cx="70"
              cy="70"
            />
          </svg>
          <div class="preloader-logo-wrapper">
            <img src="/src/assets/images/brand/4life-logo-light.svg" alt="4Life Logo" class="preloader-logo" />
          </div>
        </div>
        <div class="preloader-text-group preloader-anim-item">
          <p class="preloader-text">Инициализация иммунной поддержки...</p>
          <p class="preloader-percentage" id="preloader-percentage">0%</p>
        </div>
      </div>
    </div>
    <div id="root"></div>

    <script>
      (function () {
        const logoImg = document.querySelector(".preloader-logo");
        if (logoImg && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
          logoImg.src = "/src/assets/images/brand/4life-logo.svg";
        }

        const preloader = document.getElementById("preloader");
        const percentageEl = document.getElementById("preloader-percentage");
        const ring = document.getElementById("progress-ring-circle");
        const radius = ring.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;

        gsap.set(ring, { strokeDasharray: circumference, strokeDashoffset: circumference });

        let progress = { value: 0 };
        let assetsReady = false;
        let animationFinished = false;

        const masterTimeline = gsap.timeline({
          paused: true,
          onComplete: () => {
            animationFinished = true;
            finishLoading();
          },
        });

        masterTimeline.to(".preloader-anim-item", {
          autoAlpha: 1,
          y: 0,
          stagger: 0.15,
          duration: 1,
          ease: "power3.out",
        });

        masterTimeline.to(
          progress,
          {
            value: 99.9,
            duration: 2.0,
            ease: "none",
            onUpdate: () => {
              const currentPercent = Math.floor(progress.value);
              const offset = circumference - (currentPercent / 100) * circumference;
              gsap.set(ring, { strokeDashoffset: offset });
              if (percentageEl) percentageEl.textContent = `${currentPercent}%`;
            },
          },
          "-=0.75"
        );

        function finishLoading() {
          if (!assetsReady || !animationFinished) return;

          const outroTl = gsap.timeline();
          outroTl.to(progress, {
            value: 100,
            duration: 0.6,
            ease: "power2.out",
            onUpdate: () => {
              const currentPercent = Math.floor(progress.value);
              const offset = circumference - (currentPercent / 100) * circumference;
              gsap.set(ring, { strokeDashoffset: offset });
              if (percentageEl) percentageEl.textContent = `${currentPercent}%`;
            },
          });
          outroTl.to(".preloader-text-group", { autoAlpha: 0, y: -20, duration: 0.4, ease: "power2.in" }, "+=0.2");
          outroTl.to(
            ".progress-ring-container",
            { autoAlpha: 0, scale: 0.8, duration: 0.5, ease: "power2.in" },
            "-=0.3"
          );
          outroTl.to("#preloader", {
            autoAlpha: 0,
            duration: 1.0,
            ease: "expo.inOut",
            onComplete: () => preloader.remove(),
          });
        }

        const loadCriticalAssets = () => {
          const isMobile = window.innerWidth < 768;
          const criticalAssetUrl = isMobile
            ? "/src/assets/images/backgrounds/bg-hero-Mobile.webp"
            : "/src/assets/images/backgrounds/bg-hero-PC.webp";

          const imagePromise = new Promise((resolve) => {
            const img = new Image();
            img.src = criticalAssetUrl;
            img.onload = resolve;
            img.onerror = resolve;
          });

          const scriptPromise = new Promise((resolve) => {
            const mainScript = document.createElement("script");
            mainScript.type = "module";
            mainScript.src = "/src/main.tsx";
            mainScript.onload = () => {
              window.addEventListener("app-mounted", resolve, { once: true });
            };
            document.body.appendChild(mainScript);
          });

          Promise.all([imagePromise, scriptPromise]).then(() => {
            assetsReady = true;
            finishLoading();
          });
        };

        // Запускаем анимацию и загрузку одновременно
        masterTimeline.play();
        loadCriticalAssets();
      })();
    </script>
  </body>
</html>
