<!doctype html>
<html class="dark" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>4Life: Здоровье, Энергия, Возможности | Официальный Представитель</title>
    <meta
      name="description"
      content="Инвестируйте в свое здоровье и будущее с 4Life. Узнайте о продуктах для иммунной системы, энергии и возможностях партнерства. Ваш наставник в мире 4Life."
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <style>
      :root {
        --preloader-bg-light: #f1f5f9;
        --preloader-bg-dark: #0f172a;
        --preloader-text-light: #475569;
        --preloader-text-dark: #94a3b8;
        --preloader-percent-light: #1e293b;
        --preloader-percent-dark: #e2e8f0;
        --preloader-neon-color: #00aaff;
        --preloader-track-color-light: rgba(100, 116, 139, 0.15);
        --preloader-track-color-dark: rgba(203, 213, 225, 0.1);
      }

      html {
        scrollbar-gutter: stable;
      }

      body:has(#preloader) {
        overflow: hidden !important;
        touch-action: none;
      }

      #root {
        /* По умолчанию скрываем основной контейнер приложения.
           Это не даст Chrome показать пустой скелет страницы
           до того, как React будет готов. */
        opacity: 0;
        /* Плавное появление, когда GSAP изменит opacity на 1 */
        transition: opacity 0.6s ease;
      }

      #preloader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--preloader-bg-light);
        opacity: 1;
        will-change: opacity;
        backface-visibility: hidden;
        perspective: 1000px;
      }

      @media (prefers-color-scheme: dark) {
        #preloader {
          background: var(--preloader-bg-dark);
        }
      }

      .preloader-stage {
        position: relative;
        width: 140px;
        height: 200px;
        transform-style: preserve-3d;
        will-change: transform;
      }

      .progress-ring-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 140px;
        height: 140px;
        will-change: transform, opacity;
        transform-style: preserve-3d;
      }

      .preloader-text-group {
        position: absolute;
        top: 160px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        width: 280px;
        will-change: transform, opacity;
      }

      .progress-ring-haze {
        position: absolute;
        inset: -20px;
        background: radial-gradient(circle, var(--preloader-neon-color) 0%, transparent 70%);
        opacity: 0;
        filter: blur(40px);
        will-change: opacity, transform;
        display: none;
      }

      .progress-ring__svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        will-change: transform;
      }

      .progress-ring__track,
      .progress-ring__progress {
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
        will-change: stroke-dashoffset;
      }

      .progress-ring__track {
        stroke: var(--preloader-track-color-light);
        stroke-width: 3;
        fill: none;
      }

      @media (prefers-color-scheme: dark) {
        .progress-ring__track {
          stroke: var(--preloader-track-color-dark);
        }
      }

      .progress-ring__progress {
        stroke: var(--preloader-neon-color);
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        filter: drop-shadow(0 0 8px var(--preloader-neon-color));
      }

      .preloader-logo-wrapper {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        will-change: transform;
      }

      .preloader-logo {
        width: 96px;
        height: 48px;
        will-change: transform;
      }

      .preloader-text,
      .preloader-percentage {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        white-space: nowrap;
        will-change: transform;
      }

      .preloader-text {
        font-size: 1rem;
        font-weight: 500;
        color: var(--preloader-text-light);
        margin: 0;
      }

      @media (prefers-color-scheme: dark) {
        .preloader-text {
          color: var(--preloader-text-dark);
        }
      }

      .preloader-percentage {
        font-size: 1.5rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--preloader-percent-light);
        margin: 0;
      }

      @media (prefers-color-scheme: dark) {
        .preloader-percentage {
          color: var(--preloader-percent-dark);
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <div class="preloader-stage">
        <div class="progress-ring-container">
          <div class="progress-ring-haze"></div>
          <svg class="progress-ring__svg" viewBox="0 0 140 140">
            <circle class="progress-ring__track" r="68" cx="70" cy="70" />
            <circle id="progress-ring-circle" class="progress-ring__progress" r="68" cx="70" cy="70" />
          </svg>
          <div class="preloader-logo-wrapper">
            <img src="/images/brand/4life-logo-light.svg" alt="4Life Logo" class="preloader-logo" />
          </div>
        </div>
        <div class="preloader-text-group">
          <p class="preloader-text">Инициализация иммунной поддержки...</p>
          <p class="preloader-percentage" id="preloader-percentage">0%</p>
        </div>
      </div>
    </div>
    <div id="root"></div>

    <!-- Vite will inject the script tag here in production -->
    <script type="module" src="/src/main.tsx"></script>

    <script>
      (function () {
        // [WebGPU 2026] Фоновое определение точной видеокарты во время работы прелоадера
        (function () {
          if (navigator.gpu && typeof sessionStorage !== "undefined") {
            navigator.gpu
              .requestAdapter()
              .then(function (adapter) {
                if (adapter) {
                  // Использование нативного синхронного свойства adapter.info (стандарт 2026)
                  const info = adapter.info;
                  if (info && info.device) {
                    sessionStorage.setItem("4life_gpu", info.device);
                  }
                }
              })
              .catch(function () {});
          }
        })();

        // Логотип для светлой темы
        const logoImg = document.querySelector(".preloader-logo");
        if (logoImg && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
          logoImg.src = "/images/brand/4life-logo.svg";
        }

        // Элементы
        const preloader = document.getElementById("preloader");
        const stage = document.querySelector(".preloader-stage");
        const ringContainer = document.querySelector(".progress-ring-container");
        const textGroup = document.querySelector(".preloader-text-group");
        const haze = document.querySelector(".progress-ring-haze");
        const logo = document.querySelector(".preloader-logo");
        const percentageEl = document.getElementById("preloader-percentage");
        const ring = document.getElementById("progress-ring-circle");

        // Прогресс кольцо
        const radius = 68;
        const circumference = 2 * Math.PI * radius;

        // Начальные состояния
        gsap.set([stage, ringContainer, textGroup], { opacity: 0 });
        gsap.set(stage, { scale: 0.6, rotationX: 45, z: -200 });
        gsap.set(textGroup, { y: 40 });
        gsap.set(logo, { scale: 0.8 });
        gsap.set(haze, { opacity: 0, scale: 0.8 });
        gsap.set(ring, {
          strokeDasharray: circumference,
          strokeDashoffset: circumference,
          opacity: 0,
        });

        // Прогресс объект
        const progress = { value: 0, display: 0 };
        let assetsReady = false;
        let canFinish = false;

        // 🎭 Awwwards хореография
        const masterTl = gsap.timeline({
          onComplete: () => {
            canFinish = true;
            checkFinish();
          },
        });

        // ✨ Нежное материализация из эфира (0.9s)
        masterTl.to(stage, {
          opacity: 1,
          scale: 1,
          rotationX: 0,
          z: 0,
          duration: 0.9,
          ease: "expo.out",
        });

        // 🌸 Синхронное появление всех элементов
        masterTl.to(
          ringContainer,
          {
            opacity: 1,
            duration: 0.6,
            ease: "power2.out",
          },
          "-=0.7",
        );

        masterTl.to(
          [ring, haze],
          {
            opacity: 1,
            duration: 0.5,
            ease: "power2.out",
          },
          "-=0.4",
        );

        masterTl.to(
          logo,
          {
            scale: 1,
            duration: 0.7,
            ease: "back.out(1.1)",
          },
          "-=0.5",
        );

        masterTl.to(
          textGroup,
          {
            opacity: 1,
            y: 0,
            duration: 0.6,
            ease: "power3.out",
          },
          "-=0.3",
        );

        // 🌊 Одновременный старт прогресса с текстом
        masterTl.to(
          progress,
          {
            value: 99.5,
            duration: 2.2,
            ease: "power1.inOut",
            onUpdate: updateProgress,
          },
          "-=0.6",
        );

        // 💫 Плавные проценты
        masterTl.to(
          progress,
          {
            display: 99.5,
            duration: 2.2,
            ease: "power1.inOut",
            onUpdate: () => {
              if (percentageEl) {
                percentageEl.textContent = `${Math.round(progress.display)}%`;
              }
            },
          },
          "-=2.2",
        );

        // 🌟 Живое дыхание свечения
        gsap.to(
          haze,
          {
            opacity: 0.3,
            scale: 1.15,
            duration: 1.8,
            ease: "sine.inOut",
            yoyo: true,
            repeat: -1,
          },
          1.0,
        );

        // 💎 Тонкая пульсация лого
        gsap.to(
          logo,
          {
            scale: 1.02,
            duration: 2.2,
            ease: "sine.inOut",
            yoyo: true,
            repeat: -1,
          },
          1.2,
        );

        function updateProgress() {
          const offset = circumference - (progress.value / 100) * circumference;
          ring.style.strokeDashoffset = offset;
        }

        function checkFinish() {
          if (!assetsReady || !canFinish) return;

          // ▼ Добавляем эту строку, чтобы получить доступ к #root
          const rootEl = document.getElementById("root");

          // 🌅 Элегантное растворение
          const outroTl = gsap.timeline();

          // Финальный штрих до 100%
          outroTl.to(progress, {
            value: 100,
            display: 100,
            duration: 0.4,
            ease: "power2.out",
            onUpdate: () => {
              updateProgress();
              if (percentageEl) percentageEl.textContent = `${Math.round(progress.display)}%`;
            },
          });

          // Нежное исчезновение текста
          outroTl.to(
            textGroup,
            {
              opacity: 0,
              y: -20,
              duration: 0.5,
              ease: "power2.inOut",
            },
            "+=0.2",
          );

          /* ▼▼▼ НАЧАЛО КЛЮЧЕВОГО ИСПРАВЛЕНИЯ №2 ▼▼▼ */
          // В этот момент приложение React уже отрендерено в невидимый #root.
          // Мы плавно показываем его прямо перед тем, как прелоадер исчезнет.
          if (rootEl) {
            outroTl.to(
              rootEl,
              {
                opacity: 1,
                duration: 0.6,
                ease: "power2.inOut",
              },
              "-=0.5",
            ); // Начинаем анимацию появления немного раньше для бесшовного перехода
          }
          /* ▲▲▲ КОНЕЦ КЛЮЧЕВОГО ИСПРАВЛЕНИЯ №2 ▲▲▲ */

          // Затухание свечения и кольца
          outroTl.to(
            [haze, ring],
            {
              opacity: 0,
              duration: 0.4,
              ease: "power2.inOut",
            },
            "-=0.3",
          );

          // Растворение в эфире
          outroTl.to(
            stage,
            {
              scale: 0.7,
              rotationX: -30,
              z: -150,
              opacity: 0,
              duration: 0.8,
              ease: "expo.inOut",
            },
            "-=0.2",
          );

          // Финальное затемнение
          outroTl.to(
            preloader,
            {
              opacity: 0,
              duration: 0.6,
              ease: "power2.inOut",
              onComplete: () => preloader.remove(),
            },
            "-=0.4",
          );
        }

        // Загрузка критичных ресурсов
        const loadAssets = () => {
          const isMobile = window.innerWidth < 768;
          const criticalAssetUrl = isMobile
            ? "/images/backgrounds/bg-hero-Mobile.webp"
            : "/images/backgrounds/bg-hero-PC.webp";

          const imagePromise = new Promise((resolve) => {
            const img = new Image();
            img.src = criticalAssetUrl;
            img.onload = resolve;
            img.onerror = resolve;
          });

          const appMountedPromise = new Promise((resolve) => {
            window.addEventListener("app-mounted", resolve, { once: true });
          });

          Promise.all([imagePromise, appMountedPromise]).then(() => {
            assetsReady = true;
            checkFinish();
          });
        };

        // Запуск
        loadAssets();
      })();
    </script>
  </body>
</html>
