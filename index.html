<!-- index.html -->
<!doctype html>
<html class="dark" lang="ru" style="background-color: #03050a">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>4Life: Здоровье, Энергия, Возможности | Официальный Представитель</title>
    <meta
      name="description"
      content="Инвестируйте в свое здоровье и будущее с 4Life. Узнайте о продуктах для иммунной системы, энергии и возможностях партнерства. Ваш наставник в мире 4Life."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&family=JetBrains+Mono:wght@400..700&display=swap"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
      :root {
        --preloader-bg-dark: #03050a;
        --preloader-text-dark: #475569;
        --preloader-percent-dark: #ffffff;
        --preloader-neon-color: #06b6d4;
        --preloader-track-color-dark: rgba(255, 255, 255, 0.02);
      }

      html {
        scrollbar-gutter: stable;
        background-color: var(--preloader-bg-dark);
      }

      body.preloader-locked {
        overflow: hidden !important;
        touch-action: none;
      }

      #root {
        opacity: 1;
      }

      #preloader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 45%, rgba(6, 182, 212, 0.08) 0%, transparent 45%),
          radial-gradient(circle at 50% 50%, #050b14 0%, #03050a 100%);
        opacity: 1;
        will-change: opacity;
        backface-visibility: hidden;
        perspective: 1200px;
        pointer-events: auto;
      }

      #preloader::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        background: radial-gradient(circle at 50% 50%, transparent 35%, rgba(3, 5, 10, 0.9) 100%);
        pointer-events: none;
      }

      .preloader-noise {
        position: absolute;
        inset: 0;
        z-index: 1;
        background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
        background-size: 24px 24px;
        opacity: 0.25;
        pointer-events: none;
      }

      .preloader-stage {
        position: relative;
        z-index: 3;
        width: 140px;
        height: 200px;
        transform-style: preserve-3d;
        will-change: transform, opacity;
        pointer-events: none;
      }

      @keyframes orbitSpin {
        0% {
          transform: rotate3d(0, 0, 1, 0deg);
        }
        100% {
          transform: rotate3d(0, 0, 1, 360deg);
        }
      }

      .progress-ring-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 140px;
        height: 140px;
        transform-style: preserve-3d;
        will-change: transform, opacity;
        animation: orbitSpin 24s linear infinite;
        pointer-events: none;
      }

      .preloader-logo-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 140px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        will-change: transform;
        pointer-events: none;
      }

      .preloader-text-group {
        position: absolute;
        top: 152px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.55rem;
        width: 320px;
        will-change: transform, opacity;
        pointer-events: none;
      }

      .progress-ring-haze {
        position: absolute;
        inset: -25px;
        background: radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.12) 0%, transparent 65%);
        opacity: 0;
        will-change: opacity, transform;
        pointer-events: none;
      }

      @keyframes hazeBreathe {
        0% {
          transform: scale3d(0.97, 0.97, 1);
          opacity: 0.35;
        }
        50% {
          transform: scale3d(1.03, 1.03, 1);
          opacity: 0.55;
        }
        100% {
          transform: scale3d(0.97, 0.97, 1);
          opacity: 0.35;
        }
      }

      .progress-ring-haze.breathing {
        animation: hazeBreathe 8s ease-in-out infinite;
      }

      .progress-ring__svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        will-change: transform;
      }

      .progress-ring__track,
      .progress-ring__progress,
      .progress-ring__glow {
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
        will-change: stroke-dashoffset;
      }

      .progress-ring__track {
        stroke: var(--preloader-track-color-dark);
        stroke-width: 1.2px;
        fill: none;
      }

      .progress-ring__glow {
        stroke: var(--preloader-neon-color);
        stroke-width: 4.5px;
        fill: none;
        stroke-linecap: round;
        opacity: 0.15;
      }

      .progress-ring__progress {
        stroke: var(--preloader-neon-color);
        stroke-width: 1.5px;
        fill: none;
        stroke-linecap: round;
      }

      .preloader-logo {
        width: 86px;
        height: 43px;
        will-change: transform;
        image-rendering: smooth;
        -webkit-image-rendering: smooth;
      }

      .preloader-text,
      .preloader-percentage {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        white-space: nowrap;
        will-change: transform, opacity;
      }

      .preloader-text {
        font-size: 0.62rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: var(--preloader-text-dark);
        margin: 0;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }

      .preloader-percentage {
        font-size: 1.65rem;
        font-weight: 200;
        font-variant-numeric: tabular-nums;
        color: var(--preloader-percent-dark);
        margin: 0;
        letter-spacing: -0.05em;
        text-shadow: 0 0 12px rgba(6, 182, 212, 0.2);
      }
    </style>
  </head>
  <body class="preloader-locked">
    <div id="preloader">
      <div class="preloader-noise"></div>
      <div class="preloader-stage">
        <div class="progress-ring-container">
          <div class="progress-ring-haze"></div>
          <svg class="progress-ring__svg" viewBox="0 0 140 140">
            <circle class="progress-ring__track" r="68" cx="70" cy="70" />
            <circle id="progress-ring-glow" class="progress-ring__glow" r="68" cx="70" cy="70" />
            <circle id="progress-ring-circle" class="progress-ring__progress" r="68" cx="70" cy="70" />
          </svg>
        </div>
        <div class="preloader-logo-wrapper">
          <img src="/images/brand/4life-logo-light.svg" alt="4Life Logo" class="preloader-logo" />
        </div>
        <div class="preloader-text-group">
          <p class="preloader-text">Инициализация иммунной поддержки...</p>
          <p class="preloader-percentage" id="preloader-percentage">0%</p>
        </div>
      </div>
    </div>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      (function () {
        try {
          if (navigator.gpu && typeof window.sessionStorage !== "undefined") {
            navigator.gpu
              .requestAdapter()
              .then(function (adapter) {
                if (adapter) {
                  const info = adapter.info;
                  if (info && info.device) {
                    try {
                      window.sessionStorage.setItem("4life_gpu", info.device);
                    } catch (_) {}
                  }
                }
              })
              .catch(function () {});
          }
        } catch (_) {}
      })();

      (function () {
        const preloader = document.getElementById("preloader");
        const stage = document.querySelector(".preloader-stage");
        const textGroup = document.querySelector(".preloader-text-group");
        const haze = document.querySelector(".progress-ring-haze");
        const logo = document.querySelector(".preloader-logo");
        const percentageEl = document.getElementById("preloader-percentage");
        const ring = document.getElementById("progress-ring-circle");
        const ringGlow = document.getElementById("progress-ring-glow");
        const ringContainer = document.querySelector(".progress-ring-container");

        const radius = 68;
        const circumference = 2 * Math.PI * radius;

        // Capture CDN GSAP locally for the preloader and clear window.gsap so npm GSAP + ScrollTrigger never collide
        const gsap = window.gsap;
        try {
          delete window.gsap;
        } catch (_) {
          window.gsap = undefined;
        }

        // If external CDN GSAP is blocked or slow, gracefully bypass preloader
        if (typeof gsap === "undefined") {
          const dismissFallback = () => {
            window.__preloaderFinished = true;
            window.dispatchEvent(new CustomEvent("preloader-outro-start"));
            document.body.classList.remove("preloader-locked");
            if (preloader) {
              preloader.style.pointerEvents = "none";
              preloader.style.transition = "opacity 0.45s ease";
              preloader.style.opacity = "0";
              setTimeout(() => preloader.remove(), 480);
            }
          };
          window.addEventListener("app-mounted", dismissFallback, { once: true });
          setTimeout(dismissFallback, 1500);
          return;
        }

        gsap.set(stage, { opacity: 0, y: 15, scale: 0.97 });
        gsap.set(textGroup, { opacity: 0, y: 8 });
        gsap.set(logo, { scale: 0.95, opacity: 0 });
        gsap.set(haze, { opacity: 0 });
        gsap.set([ring, ringGlow], {
          strokeDasharray: circumference,
          strokeDashoffset: circumference,
          opacity: 0,
        });

        let assetsReady = false;
        let canFinish = false;
        let displayedProgress = 0;
        let targetProgress = 0;
        let isOutroTriggered = false;
        let lastRoundedVal = -1;

        const masterTl = gsap.timeline({
          onComplete: () => {
            canFinish = true;
            checkFinish();
          },
        });

        masterTl.to(stage, {
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 2.2,
          ease: "power4.out",
        });

        masterTl.to(
          [ring, ringGlow, haze],
          {
            opacity: 1,
            duration: 1.6,
            ease: "power3.out",
            onComplete: () => {
              if (haze) haze.classList.add("breathing");
            },
          },
          "-=1.8",
        );

        masterTl.to(
          logo,
          {
            opacity: 1,
            scale: 1,
            duration: 1.8,
            ease: "power3.out",
          },
          "-=1.5",
        );

        masterTl.to(
          textGroup,
          {
            opacity: 1,
            y: 0,
            duration: 1.6,
            ease: "power4.out",
          },
          "-=1.6",
        );

        requestAnimationFrame(tickProgress);

        function updateProgress(val) {
          const rounded = Math.round(val);
          if (rounded === lastRoundedVal) return;
          lastRoundedVal = rounded;

          if (percentageEl) percentageEl.textContent = `${rounded}%`;

          const offset = circumference - (rounded / 100) * circumference;
          if (ring) ring.style.strokeDashoffset = offset;
          if (ringGlow) ringGlow.style.strokeDashoffset = offset;
        }

        function tickProgress() {
          if (isOutroTriggered) return;

          if (!assetsReady) {
            if (targetProgress < 15) targetProgress += 0.2;
            else if (targetProgress < 50) targetProgress += 0.3;
            else if (targetProgress < 85) targetProgress += 0.1;
            else if (targetProgress < 98) targetProgress += 0.015;
          } else {
            targetProgress = 100;
          }

          const diff = targetProgress - displayedProgress;
          if (diff > 0) {
            const step = Math.min(diff * 0.03, 0.65);
            displayedProgress += step;
          }

          updateProgress(displayedProgress);

          if (displayedProgress >= 99.8 && assetsReady) {
            displayedProgress = 100;
            updateProgress(100);
            triggerOutro();
          } else {
            requestAnimationFrame(tickProgress);
          }
        }

        function triggerOutro() {
          if (isOutroTriggered) return;
          isOutroTriggered = true;
          checkFinish();
        }

        let outroStarted = false;

        function forceFinishPreloader() {
          if (outroStarted) return;
          outroStarted = true;
          window.__preloaderFinished = true;
          window.dispatchEvent(new CustomEvent("preloader-outro-start"));
          document.body.classList.remove("preloader-locked");

          if (typeof gsap === "undefined") {
            if (preloader) {
              preloader.style.pointerEvents = "none";
              preloader.style.transition = "opacity 0.5s ease";
              preloader.style.opacity = "0";
              setTimeout(() => preloader.remove(), 520);
            }
            return;
          }

          const outroTl = gsap.timeline();

          outroTl.to(stage, {
            scale: 0.8,
            z: -240,
            opacity: 0,
            duration: 1.4,
            ease: "power4.inOut",
          });

          outroTl.to(
            haze,
            {
              scale: 1.6,
              opacity: 0,
              duration: 1.3,
              ease: "power3.inOut",
              onStart: () => {
                if (haze) haze.classList.remove("breathing");
              },
            },
            "-=1.4",
          );

          outroTl.to(
            preloader,
            {
              opacity: 0,
              duration: 1.3,
              ease: "power3.inOut",
              onStart: () => {
                if (preloader) {
                  preloader.style.pointerEvents = "none";
                }
              },
              onComplete: () => {
                if (preloader) {
                  preloader.remove();
                }
              },
            },
            "-=1.2",
          );
        }

        function checkFinish() {
          if (!assetsReady || displayedProgress < 100 || !canFinish) return;
          forceFinishPreloader();
        }

        setTimeout(() => {
          if (!outroStarted) {
            assetsReady = true;
            canFinish = true;
            displayedProgress = 100;
            updateProgress(100);
            forceFinishPreloader();
          }
        }, 5500);

        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            if (ringContainer) ringContainer.style.animationPlayState = "paused";
            if (haze) haze.style.animationPlayState = "paused";
            masterTl.pause();
          } else {
            if (ringContainer) ringContainer.style.animationPlayState = "running";
            if (haze) haze.style.animationPlayState = "running";
            if (!isOutroTriggered) {
              masterTl.resume();
            }
          }
        });

        const loadAssets = () => {
          const appMountedPromise = new Promise((resolve) => {
            if (window.__appMounted) {
              resolve();
              return;
            }
            window.addEventListener("app-mounted", resolve, { once: true });
          });

          const fontsReadyPromise =
            document.fonts && document.fonts.ready
              ? document.fonts.ready.catch(() => {})
              : Promise.resolve();

          const fallbackTimer = setTimeout(() => {
            if (!isOutroTriggered) {
              assetsReady = true;
              checkFinish();
            }
          }, 3500);

          Promise.allSettled([appMountedPromise, fontsReadyPromise]).then(() => {
            clearTimeout(fallbackTimer);
            assetsReady = true;
            checkFinish();
          });
        };

        loadAssets();
      })();
    </script>
  </body>
</html>
